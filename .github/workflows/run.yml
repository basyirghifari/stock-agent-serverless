name: Run Stock Checker Daily

on:
  schedule:
    - cron: '0 2 * * 1-5' # Jalan jam 9 pagi WIB (Senin-Jumat)
  workflow_dispatch:      # Tombol untuk jalankan manual

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instal Library
        run: pip install -r requirements.txt

      - name: Jalankan Skrip
        run: python main.py
